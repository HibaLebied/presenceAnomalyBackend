spring:
  application:
    name: attendance-anomaly-backend

  datasource:
    dashboard:
      url: ${APP_DB_URL}
      username: ${APP_DB_USERNAME}
      password: ${APP_DB_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      hikari:
        pool-name: DashboardHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    source:
      url: ${SOURCE_DB_URL}
      username: ${SOURCE_DB_USERNAME}
      password: ${SOURCE_DB_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      hikari:
        pool-name: SourceHikariPool
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.company.attendance: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

attendance:
  synchronization:
    batch-size: 500

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:28800000}
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
app:
  cors:
    allowed-origins:
      - http://localhost:5173

